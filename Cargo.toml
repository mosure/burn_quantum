[workspace]
members = ["crates/burn_quantum", "crates/burn_quantum_example", "crates/burn_quantum_visualization"]
default-members = ["crates/burn_quantum", "crates/burn_quantum_example"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mosure/burn_quantum"

[workspace.dependencies]
burn_quantum = { version = "0.4.0", path = "crates/burn_quantum" }
burn = { version = "~0.22.1", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.9"
rand_chacha = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# The browser gallery is measured separately from native numerical workloads.
[profile.web-release]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
