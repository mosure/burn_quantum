[workspace]
members = ["crates/burn_quantum", "crates/burn_quantum_example"]
default-members = ["crates/burn_quantum", "crates/burn_quantum_example"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mosure/burn_quantum"

[workspace.dependencies]
burn_quantum = { path = "crates/burn_quantum" }
burn = { version = "~0.22.1", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.9"
rand_chacha = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
