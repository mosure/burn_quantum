name: ci
on: [push, pull_request]
permissions:
  contents: read
env:
  # Keep Bevy's test executables within hosted-runner disk budgets.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --all-targets
      - run: cargo test --locked --workspace --doc
      - run: cargo check --locked -p burn_quantum --no-default-features
      - run: cargo check --locked -p burn_quantum --no-default-features --features flex
      - run: cargo run --locked -p burn_quantum --example train
      - run: cargo run --locked -p burn_quantum --example hybrid
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo package --locked -p burn_quantum
  gpu-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --workspace --features wgpu,cuda,fusion --all-targets
      - run: cargo check --locked -p burn_quantum_visualization --features gpu-bridge --all-targets
  core-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked -p burn_quantum
