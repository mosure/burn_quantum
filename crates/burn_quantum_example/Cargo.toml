[package]
name = "burn_quantum_example"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
repository.workspace = true
description = "Executable canonical quantum ML examples built on burn_quantum"
readme = "README.md"

[features]
wgpu = ["burn_quantum/wgpu", "burn/wgpu"]
cuda = ["burn_quantum/cuda", "burn/cuda"]
fusion = ["burn_quantum/fusion", "burn/fusion"]

[dependencies]
pollster = "0.4"
burn_quantum = { workspace = true, features = ["benchmarks"] }
burn = { workspace = true, features = ["flex", "autodiff", "optim"] }
serde.workspace = true
serde_json.workspace = true
rand.workspace = true
rand_chacha.workspace = true

[lints]
workspace = true
